<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- stem -->
  <path d="M32 36 C 31 43, 33 51, 30 60" stroke="#4a7c3f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- leaf -->
  <path d="M31 51 C 24 50, 21 56, 26 58 C 31 56, 31 53, 31 51 Z" fill="#5b9a4d"/>
  <!-- five sky-blue petals -->
  <g fill="#5b9bd5">
    <ellipse cx="32" cy="21" rx="6.2" ry="9.5"/>
    <ellipse cx="32" cy="21" rx="6.2" ry="9.5" transform="rotate(72 32 21)"/>
    <ellipse cx="32" cy="21" rx="6.2" ry="9.5" transform="rotate(144 32 21)"/>
    <ellipse cx="32" cy="21" rx="6.2" ry="9.5" transform="rotate(216 32 21)"/>
    <ellipse cx="32" cy="21" rx="6.2" ry="9.5" transform="rotate(288 32 21)"/>
  </g>
  <!-- petal highlights -->
  <g fill="#8ec5ef" opacity="0.5">
    <ellipse cx="32" cy="20" rx="3.2" ry="5.6"/>
    <ellipse cx="32" cy="20" rx="3.2" ry="5.6" transform="rotate(72 32 20)"/>
    <ellipse cx="32" cy="20" rx="3.2" ry="5.6" transform="rotate(144 32 20)"/>
    <ellipse cx="32" cy="20" rx="3.2" ry="5.6" transform="rotate(216 32 20)"/>
    <ellipse cx="32" cy="20" rx="3.2" ry="5.6" transform="rotate(288 32 20)"/>
  </g>
  <!-- center: pale eye + golden star -->
  <circle cx="32" cy="21" r="4.6" fill="#f7f3e6"/>
  <circle cx="32" cy="21" r="2.5" fill="#f2c94c"/>
  <circle cx="32" cy="21" r="1.2" fill="#e0a32c"/>
</svg>
